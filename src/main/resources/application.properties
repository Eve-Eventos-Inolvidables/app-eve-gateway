spring.application.name=app-eve-apigateway
server.port=8080
# URL de tu servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rutas explicitas (el gateway WebMVC no soporta discovery.locator)
spring.cloud.gateway.server.webmvc.routes[0].id=ms-users
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://app-eve-ms-users
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/app-eve-ms-users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=ms-events
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://app-eve-ms-events
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/app-eve-ms-events/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webmvc.routes[2].id=ms-userinterests
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://app-eve-ms-userinterests
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/app-eve-ms-userinterests/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Configuración de los microservicios para centralizar Swagger
springdoc.swagger-ui.urls[0].name=Users Microservice
springdoc.swagger-ui.urls[0].url=/app-eve-ms-users/v3/api-docs

springdoc.swagger-ui.urls[1].name=Events Microservice
springdoc.swagger-ui.urls[1].url=/app-eve-ms-events/v3/api-docs

springdoc.swagger-ui.urls[2].name=Events Intereses
springdoc.swagger-ui.urls[2].url=/app-eve-ms-userinterests/v3/api-docs