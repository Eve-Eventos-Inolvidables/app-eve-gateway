spring.application.name=app-eve-apigateway
server.port=8080
# URL de tu servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Habilitar el enrutamiento automático basado en el nombre de los microservicios registrados
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Configuración de los microservicios para centralizar Swagger
springdoc.swagger-ui.urls[0].name=Users Microservice
springdoc.swagger-ui.urls[0].url=/app-eve-ms-users/v3/api-docs

springdoc.swagger-ui.urls[1].name=Events Microservice
springdoc.swagger-ui.urls[1].url=/app-eve-ms-events/v3/api-docs